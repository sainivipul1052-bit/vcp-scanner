name: Daily VCP Stock Screener & Tracker

on:
  schedule:
    # Runs every trading day (Monday to Friday) at 10:30 UTC (4:00 PM IST, after NSE close)
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # Allows manual trigger from the Actions tab anytime

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Run Daily VCP Screener & Portfolio Tracker
        run: python scanner.py

      - name: Commit and push all 3 CSV files
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add best_stocks.csv trade_log.csv portfolio_summary.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Daily VCP Watchlist, Trade Log & Portfolio Update [skip ci]" && git push)
