
name: Stock Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * 1-5"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install scanner packages
        run: python -m pip install --upgrade pip pandas numpy requests yfinance

      - name: Run Python scanner
        run: python scanner.py

      - name: Save CSV reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-scanner-reports
          path: |
            early_entry_radar.csv
            breakout_alerts.csv
          if-no-files-found: warn
          retention-days: 7
