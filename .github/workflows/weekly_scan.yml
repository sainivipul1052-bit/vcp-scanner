name: Weekly VCP Stock Screener

on:
  schedule:
    # Runs every Monday at 01:00 UTC (6:30 AM IST)
    - cron: '0 1 * * 1'
  workflow_dispatch: # Allows manual trigger from website anytime

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Run VCP Screener Script
        run: python scanner.py

      - name: Commit and push changes to CSV
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add best_stocks.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update weekly VCP best stocks CSV [skip ci]" && git push)
          
